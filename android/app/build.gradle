}

android {
    namespace 'ni.whitesoftware.rider'
    compileSdk 36

    defaultConfig {
        applicationId 'ni.whitesoftware.rider'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
